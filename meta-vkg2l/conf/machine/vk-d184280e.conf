#@TYPE: Machine
#@NAME: Vekatech VK-D184280E machine
#@DESCRIPTION: RZ/G2LC platform

OVERRIDES_append = ":vk-d184280e"
SOC_FAMILY = "r9a07g044c"
require conf/machine/include/rzg2l-common.inc
require conf/machine/include/cip-core.inc
require conf/machine/include/cip-core-extend.inc

DEFAULTTUNE ?= "cortexa55"

TUNE_CONF ?= "conf/machine/include/tune-cortexa55.inc"
require ${TUNE_CONF}

PREFERRED_PROVIDER_virtual/kernel="linux-renesas"

FLASH_WRITER_BOARD ?= "VKCMG2LC"

TFA_PLATFORM ?= "g2l"
TFA_BOARD ?= "vkrzg2lc"
TFA_UBOOT ?= "1"
TFA_BUILD_TARGET ?= "bl2 bl31"
TFA_SPI_FLASH ?= "MX25L51245G"

BL2_BOOT_TARGET ?= "emmc"

BL2_ADJUST_VMA ?= "0x00011E00"
FIP_ADJUST_VMA ?= "0x0000"


UBOOT_CONFIG ??= "emmc"
UBOOT_CONFIG[emmc] = "vk-d184280e-emmc_defconfig"

UENV_FILE ?= "uEnv-vk-d184280e.txt"

# flash writer
EXTRA_IMAGEDEPENDS += " flash-writer"

# Supported devicetree
#KERNEL_DEVICETREE = " renesas/vkrzg2lc.dtb"
KERNEL_DTS = "vk-d184280e/vk-d184280e.dts"

KERNEL_DEVICETREE_OVERLAY  = " \
    vk-d184280e/overlays/vko-can.dts \
    vk-d184280e/overlays/vko-cm33.dts \
	vk-d184280e/overlays/vko-i2c2.dts \
	vk-d184280e/overlays/vko-qspi-mx25l51245g.dts \
	vk-d184280e/overlays/vko-rs485.dts \
	vk-d184280e/overlays/vko-udma.dts \
"

BSP_SOC = "RZG2LC"
BSP_BOARD = "VK-D184280E/G2LC-v2.0"

#ENABLE_SPD_OPTEE = '1'
#ENABLE_RZ_SCE    = '1'

IMAGE_BOOT_FILES = " \
	bl2_bp_emmc-${MACHINE}.bin \
	fip_emmc-${MACHINE}.bin \
	bl2_bp_emmc-${MACHINE}.srec \
	fip_emmc-${MACHINE}.srec \
	Flash_Writer_SCIF_VKCMG2LC_DDR4_2GB_1PCS.mot \
"
# generate wic image
#IMAGE_FSTYPES_remove = "tar.gz tar.bz2 wic.gz wic.bz2"
IMAGE_FSTYPES_append = " tar.xz wic wic.xz wic.bmap tar.gz tar.bz2 wic.gz wic.bz2"
IMAGE_BOOT_FILES += " Image vk-d184280e.dtb"

# Deploy the uEnv.txt to the /boot directory
WKS_FILE_DEPENDS_append = " uenv"
IMAGE_BOOT_FILES += " uEnv.txt"
IMAGE_BOOT_FILES += " readme.txt"

# Support DTB Overlay files
IMAGE_BOOT_FILES += " overlays/*;overlays/"
#IMAGE_BOOT_FILES += " cm33/*;cm33/"

WKS_DEFAULT_FILE:vk-d184280e = " ${@oe.utils.conditional("CONFIG_WKS_eMMC", "1", "image-vkboard-mmc0.wks ", " image-vkboard-sdhi1.wks ", d)} " 

# Ship kernel modules
MACHINE_ESSENTIAL_EXTRA_RRECOMMENDS_append = " kernel-modules"

WIC_INPUT_DEPENDS = "firmware-pack:do_deploy flash-writer:do_deploy"

CONFIG_MXTAPP ?= "1"
CONFIG_WLAN_CYW43439 ?= "1"

#INIT_MANAGER = "systemd"
DISTRO_FEATURES:append:vk-d184280e = " polkit"
