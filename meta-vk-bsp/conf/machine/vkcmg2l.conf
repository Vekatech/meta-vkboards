#@TYPE: Machine
#@NAME: vkcmg2l machine
#@DESCRIPTION: VK-CM/G2L board

require conf/machine/include/arm/armv8-2a/tune-cortexa55.inc
require conf/machine/include/rz-common.inc
require conf/machine/include/rzg2l-family.inc

SERIAL_CONSOLES ?= "115200;ttySC0"
# Trusted Firmware-A configuration
PREFERRED_VERSION_trusted-firmware-a ?= "2.10%"
TFA_PLATFORM ?= "g2l"
TFA_BOARD ?= "vkcmg2l"
TFA_UBOOT ?= "1"

BL2_BASE_ADDR ?= "0x00012000"
TFA_BUILD_TARGET ?= "bl2 bl31"
BL2_BOOT_TARGET ?= "qspi emmc"
TFA_SPI_FLASH ?= "S25FL128L"

BL2_ADJUST_VMA ?= "0x00011E00"
FIP_ADJUST_VMA ?= "0x0000"

# U-Boot Configuration
UBOOT_CONFIG ??= "qspi emmc"
UBOOT_CONFIG[qspi] = "vkcmg2l-qspi_defconfig"
UBOOT_CONFIG[emmc] = "vkcmg2l-emmc_defconfig"

PREFERRED_VERSION_u-boot = "2024.07%"

UENV_FILE ?= "uEnv-vkcmg2l.txt"

# Flash Writer configuration
FLASH_WRITER_BOARD ?= "VKCMG2L"

# Support board with PMIC. Default:yes.
# With this option enabled, build both bin files for PMIC board and Concrete board.
VKBOARD_SUPPORT ?= "1"
CONFIG_WKS_eMMC ?= "1"

CONFIG_WLAN_CYW43439 ?= "1"
CONFIG_UBOOT_CM33CMD ?= "0"
CONFIG_QT_DEMO ?= "0"
CONFIG_GPIO_MCP23x17 ?= "0"

# Supported devicetree
KERNEL_DTS = " \
    vkcmg2l/vkcmg2l.dts \
"
KERNEL_DEVICETREE = ""

KERNEL_DTSI = ""

KERNEL_DEVICETREE_OVERLAY  = " \
    vkcmg2l/overlays/vkcmx2l-carrier.dts \
    vkcmg2l/overlays/vkrz-cm33.dts \
    vkcmg2l/overlays/vkrz-dsi-kd070hdfia030.dts \
    vkcmg2l/overlays/vkrz-dsi-kd101wxfid045.dts \
    vkcmg2l/overlays/vkrz-exp-riic2_100.dts \
    vkcmg2l/overlays/vkrz-exp-riic2_400.dts \
    vkcmg2l/overlays/vkrz-exp-rspi1.dts \
    vkcmg2l/overlays/vkrz-exp-scfi3.dts \
    vkcmg2l/overlays/vkrz-dsi-to-lvds.dts \
"

# Wic image
WKS_FILE = " ${@oe.utils.conditional("CONFIG_WKS_eMMC", "1", "image-vkboard-mmc.wks", "image-vkrboard-esd.wks", d)} "


IMAGE_BOOT_FILES = " \
	bl2_bp_qspi-${MACHINE}.bin \
	bl2_bp_emmc-${MACHINE}.bin \
	fip_emmc-${MACHINE}.bin \
    fip_qspi-${MACHINE}.bin \
	bl2_bp_qspi-${MACHINE}.srec \
	bl2_bp_emmc-${MACHINE}.srec \
	fip_emmc-${MACHINE}.srec \
	fip_qspi-${MACHINE}.srec \
	Flash_Writer_SCIF_VKCMG2L_DDR4_2GB_1PCS.mot \
"

# Deploy the uEnv.txt to the /boot directory
WKS_FILE_DEPENDS:append = " uenv"
IMAGE_BOOT_FILES += " uEnv.txt"
IMAGE_BOOT_FILES += " readme.txt"

IMAGE_BOOT_FILES += " ${KERNEL_IMAGETYPE} vkcmg2l.dtb "

# Support DTB Overlay files
IMAGE_BOOT_FILES += " overlays/*;overlays/"

#IMAGE_FSTYPES += " wic "
IMAGE_FSTYPES:remove = "tar.gz tar.bz2 wic.gz wic.bz2"
IMAGE_FSTYPES:append = " tar.xz wic wic.xz wic.bmap"

do_image_wic[depends] += "firmware-pack:do_deploy flash-writer:do_deploy"

MACHINE_FEATURES:append = " mali-g31 hwh264dec hwh264enc"

MACHINE_EXTRA_RRECOMMENDS:append = " kernel-modules"